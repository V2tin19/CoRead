<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      #root {
        height: 100%;
        width: 100%;
        position: fixed;
        top: 0px;
        left: 0px;
      }
    </style>
    <title>CoRead - 团队共读平台</title>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/7z-wasm/7zz.umd.js"
    ></script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/libunrar/rpc.js"
    ></script>
    <script type="module">
      import "%PUBLIC_URL%/lib/pdfjs/pdf.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "%PUBLIC_URL%/lib/pdfjs/pdf.worker.mjs";
    </script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/sqljs-wasm/sql-wasm.js"
    ></script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/tesseractjs/tesseract.min.js"
    ></script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/onnxruntime-web/ort.min.js"
    ></script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/esearch-ocr/esearch-ocr.umd.js"
    ></script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/pdf-lib/html2canvas.min.js"
    ></script>
    <script
      defer
      type="text/javascript"
      src="%PUBLIC_URL%/lib/pdf-lib/pdf-lib.min.js"
    ></script>
    <script defer src="%PUBLIC_URL%/lib/vex-js/vex.combined.min.js"></script>
    <script>
      // 原来这两行是内联直接执行的，但 vex 用的是 defer，
      // 于是内联脚本先跑、vex 还没定义 —— 控制台一直报 "vex is not defined"。
      // defer 脚本会在 DOMContentLoaded 之前按序执行完，所以放到这里等它。
      window.addEventListener("DOMContentLoaded", function () {
        if (!window.vex) {
          return;
        }
        window.vex.defaultOptions.className = "vex-theme-wireframe";
        window.vex.defaultOptions.overlayClosesOnClick = false;
      });
    </script>
    <link rel="stylesheet" href="%PUBLIC_URL%/lib/vex-js/vex.min.css" />
    <link
      rel="stylesheet"
      href="%PUBLIC_URL%/lib/vex-js/vex-theme-wireframe.min.css"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <canvas id="the-canvas"></canvas>
  </body>
</html>
